project_name: "godot-development"
default_status: "To Do"
statuses: ["To Do", "Stalled", "In Progress", "Done", "Waiting On Other", "unknown dependency", "broken", "code-churn", "deprecated", "cancelled"]
labels: ["backend", "frontend", "db", "auth", "perf", "a11y", "docs", "tests", "seed", "refactor", "blocked"]
priorities: ["none", "gold-plating", "low", "mid", "high", "urgent"]
types: ["bug", "feature", "enhancement", "task", "chore", "docs", "spike", "epic"]
definition_of_done:
  - "Build & Typecheck grün: `npm run check` und `npm run build` laufen fehlerfrei, keine neuen Warnungen im berührten Code."
  - "Tests grün: `npm run test` (Jest/Vitest) läuft durch; neue Logik mit Unit-Tests abgedeckt wo sinnvoll. (Framework-Setup gilt als eigene initiale Arbeit, danach hart.)"
  - "Keine Svelte-4-Antipatterns: Runes-Idiome ($state/$derived/$effect), kein onMount-Overuse, kein Legacy-$store-/subscribe-Missbrauch, keine imperative DOM-Manipulation außerhalb $effect. Referenz ist Svelte 5.38, nicht ältere Svelte-Doku."
  - "State-Grenze sauber: Server-State wo möglich in +page.server.ts/hooks, Client-State minimal; $derived statt manueller Sync-Kopien; kein Cross-Request-Leak in Stores."
  - "Datenzugriff korrekt & N+1-frei: Relationen vorladen (relations:/Joins), Mutationen konsistent, Fehler behandelt statt verschluckt."
  - "Selbst-Rezension + Verhaltenscheck: Diff selbst gelesen, betroffener Pfad in `npm run dev` geprüft, kein Console-Error, Happy Path funktioniert sichtbar."
  - "Keine Regression: bestehende Funktionalität bleibt intakt; manueller Verhaltenscheck ersetzt Auto-Tests bis das Framework steht."
  - "Performance-Neutral bis -verbessernd: keine neue unnötige Reaktivität; bestehende Langsamkeit nicht verschlimmern; Perf-Themen in eigenen perf-Task auslagern."
  - "Doku nachgezogen: README/docs/TODO bei öffentlich- oder Setup-relevanten Änderungen; Inline-Kommentare bei nicht-offensichtlicher Logik."
  - "Backlog-Metadaten vollständig + Retry-Richtlinie eingehalten: Final-Summary geschrieben, DoD-Items per --check-dod abgehakt, Status korrekt; bei wiederholtem Scheitern: nach 3 erfolglosen Versuchen an derselben Kernproblematik Status auf code-churn setzen, Versuchshistorie in den Notes dokumentieren und Peter explizit informieren."
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "vim"
auto_open_browser: true
default_port: 6380
remote_operations: true
auto_commit: false
filesystem_only: false
zero_padded_ids: 4
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
